name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must match Cargo.toml)
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt

      - name: Match requested and manifest versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skystrike") | .version')"
          if [[ "$MANIFEST_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "::error::Requested $REQUESTED_VERSION but Cargo.toml contains $MANIFEST_VERSION."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rehearse crates.io publish
        run: cargo publish --dry-run --locked

  publish:
    name: Publish ${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Write release summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "### Published skystrike ${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://crates.io/crates/skystrike/${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
