name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Manage release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  validate:
    name: Validate release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt

      - name: Match release and manifest versions
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "skystrike") | .version')"
          if [[ "$MANIFEST_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Release Please created ${RELEASE_VERSION}, but Cargo.toml contains ${MANIFEST_VERSION}."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${RELEASE_VERSION}" ]]; then
            echo "::error::Expected tag v${RELEASE_VERSION}, but Release Please created ${RELEASE_TAG}."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rehearse crates.io publish
        run: cargo publish --dry-run --locked

  publish:
    name: Publish crates.io
    needs: [release-please, validate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Write release summary
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "### Published skystrike ${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub release: ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- crates.io: https://crates.io/crates/skystrike/${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
