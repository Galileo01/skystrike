[package]
name = "skystrike"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast terminal arcade shooter inspired by classic vertical shoot 'em ups"
license = "MIT"
repository = "https://github.com/Galileo01/skystrike"
readme = "README.md"
keywords = ["terminal-game", "shooter", "tui", "ascii", "arcade"]
categories = ["games", "command-line-utilities"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "README.zh.md",
    "LICENSE",
    "CHANGELOG.md",
    "docs/*.md",
]

[dependencies]
crossterm = "0.29"
rand = "0.10"
libc = "0.2"
